
<!DOCTYPE HTML>
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Search - {{site.data.info.title}}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="MedCom"/>

  <link href="{{site.data.info.assets}}fhir.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/bootstrap-fhir.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/project.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/pygments-manni.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/jquery-ui.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/prism.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/cqf.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/hl7-dk.css" rel="stylesheet"/>
  <link href="{{site.data.info.assets}}assets/css/search.css" rel="stylesheet"/>

  <script src="{{site.data.info.assets}}assets/js/publish-box-status.js"></script>
  <script src="{{site.data.info.assets}}assets/js/fhir-table-scripts.js"></script>
</head>

<body onload="document.body.style.opacity='1'">

  <script src="{{site.data.info.assets}}assets/js/prism.js"></script>
  <script src="{{site.data.info.assets}}assets/js/mermaid.js"></script>
  <script src="{{site.data.info.assets}}assets/js/mermaid-init.js"></script>

  <div id="segment-header" class="segment">
    <div class="container">

      <div id="hl7-nav">
        <a id="hl7-logo" no-external="true" href="https://www.medcom.dk">
          <img height="50" alt="Visit MedComs website"
               src="{{site.data.info.assets}}assets/images/dark-medcom-logo.png"/>
        </a>
      </div>

      <input id="search-box" type="text" placeholder="Search this IG...">

      <script src="{{site.data.info.assets}}assets/js/search-engine.js"></script>
      <script src="{{site.data.info.assets}}assets/js/search-categories.js"></script>
      <script src="{{site.data.info.assets}}assets/js/search.js"></script>

      <div id="family-nav">
        <a id="family-logo" no-external="true" href="http://hl7.org/fhir">
          <img height="50" alt="Visit the FHIR website"
               src="{{site.data.info.assets}}assets/images/fhir-logo-www.png"/>
        </a>
      </div>

      <div id="ig-status">
        <p>
          <span style="font-size:12pt;font-weight:bold">{{site.data.info.title}}</span>
          <br/>
          <span style="display:inline-block;">
            {{site.data.info.version}} - {{site.data.info.status}}
          </span>
        </p>
      </div>

    </div>
  </div>

  <div id="segment-navbar" class="segment">
    <div id="stripe"></div>
    <div class="container">
      <nav class="navbar navbar-inverse">
        <div class="container">
          <button data-target=".navbar-inverse-collapse"
                  class="navbar-toggle" data-toggle="collapse" type="button">
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>

          <a class="navbar-brand hidden" href="http://hl7.org/fhir/R4/index.html">FHIR</a>

          <div class="nav-collapse collapse navbar-inverse-collapse">
            <!-- menu.xml -->
          </div>
        </div>
      </nav>
    </div>
  </div>

  <div id="segment-breadcrumb" class="segment">
    <div class="container">
      <ul class="breadcrumb">
        <li><a href="toc.html"><b>Table of Contents</b></a></li>
        <li><b>Search</b></li>
      </ul>
    </div>
  </div>

  <a name="top"></a>

  <div id="segment-content" class="segment">
    <div class="container">
      <div class="row">
        <div class="inner-wrapper">

          <div class="col-12">

            <h2>Search</h2>

            <div id="search-page">

              <div class="search-page-input">
                <input id="full-search-box"
                       type="text"
                       placeholder="Search the documentation..."
                       autocomplete="off"/>
              </div>

              <div class="search-scope">
                <strong>Search in:</strong>

                <label>
                  <input type="radio" name="search-scope"
                         value="current"/>
                  This IG
                </label>

                <label>
                  <input type="radio" name="search-scope"
                         value="all" checked="checked"/>
                  All IGs
                </label>
              </div>

              <div class="search-filters">
                <div class="search-filter">
                  <strong>Filter</strong>

                  <label class="filter-chip">
                    <input type="checkbox" value="profiles"/>
                    <span>Profiles</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" value="extensions"/>
                    <span>Extensions</span>
                  </label>

                  <label class="filter-chip">
                    <input type="checkbox" value="examples"/>
                    <span>Examples</span>
                  </label>
                </div>
              </div>

              <div id="search-status"></div>
              <div id="search-results"></div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="{{site.data.info.assets}}assets/js/jquery.js"></script>
  <script src="{{site.data.info.assets}}assets/js/jquery-ui.min.js"></script>
  <script src="{{site.data.info.assets}}assets/js/window-hash.js"></script>
  <script src="{{site.data.info.assets}}assets/js/bootstrap.min.js"></script>
  <script src="{{site.data.info.assets}}assets/js/respond.min.js"></script>
  <script src="{{site.data.info.assets}}assets/js/anchor.min.js"></script>
  <script src="{{site.data.info.assets}}assets/js/clipboard.min.js"></script>
  <script src="{{site.data.info.assets}}assets/js/clipboard-btn.js"></script>
  <script src="{{site.data.info.assets}}assets/js/anchor-hover.js"></script>

</body>
</html>
